<!DOCTYPE html>
<html lang="es">

<head> 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Base de Datos de Aviones de Combate</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <header>

        <h1>BASE DE DATOS DE AVIONES DE COMBATE</h1>

    </header>

    <main>

        <div class="selector">

            <label for="aviones">Seleccione un avion:</label>

            <select id="aviones" onchange="cambiarAvion()">

                <option value="f22">F-22 Raptor</option>
                <option value="f35">F-35 Lightning II</option>

            </select>

        </div>

        <div class="imagen">

            <img id="imagenAvion" src="imagenes/f22.jpg" alt="Avión">

        </div>

        <div class="informacion">

            <h2 id="nombre"></h2>

            <table>

                <tr>
                    <td>Fabricante</td>
                    <td id="fabricante"></td>
                </tr>

                <tr>
                    <td>Pais</td>
                    <td id="pais"></td>
                </tr>

                <tr>
                    <td>Generacion</td>
                    <td id="generacion"></td>
                </tr>

                <tr>
                    <td>Velocidad</td>
                    <td id="velocidad"></td>
                </tr>

                <tr>
                    <td>Alcance</td>
                    <td id="alcance"></td>
                </tr>

                <tr>
                    <td>Motores</td>
                    <td id="motores"></td>
                </tr>

                <tr>
                    <td>Tripulacion</td>
                    <td id="tripulacion"></td>
                </tr>

            </table>

            <h3>Descripcion</h3>

            <p id="descripcion"></p>

        </div>

    </main>

    <footer>

        Military Aircraft Database v1.0

    </footer>

    <script src="script.js"></script>

</body>

</html>
